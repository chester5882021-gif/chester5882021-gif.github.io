<meta property="og:title" content="烘焙交響 Baking Symphony">
<meta property="og:description" content="手作瑪德蓮｜用甜點，奏出生命的另一種可能。">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E9; --linen:#EBE5E2; --rose:#BA9793;
    --caramel:#663C1B; --ink:#424242; --orange:#F37021; --teal:#1E8289;
    --line:rgba(102,60,27,.28); --soft:rgba(102,60,27,.62);
    --serif:"Noto Serif TC","Songti TC",serif; --latin:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--serif); color:var(--caramel); background:var(--linen);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  /* 桌機：模糊主視覺當底，名片置中 */
  .backdrop{position:fixed;inset:0;z-index:-1;background:url(img/hero.webp) center/cover;filter:blur(38px) saturate(.9);transform:scale(1.2);opacity:.55}
  .backdrop::after{content:"";position:absolute;inset:0;background:rgba(235,229,226,.55)}

  .card{
    position:relative; width:100%; max-width:440px; margin:0 auto; min-height:100vh;
    background:linear-gradient(180deg,var(--cream) 0%,var(--cream) 34%,#F7EEE6 62%,#EBDDD8 100%);
    overflow:hidden;
  }
  @media (min-width:520px){
    body{padding:40px 0}
    .card{min-height:auto;border-radius:28px;box-shadow:0 30px 80px -30px rgba(102,60,27,.45),0 0 0 1px rgba(102,60,27,.08)}
  }

  /* 主視覺 */
  .hero{position:relative;aspect-ratio:1122/1402}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,246,233,0) 72%,rgba(255,246,233,.7) 90%,var(--cream) 100%)}

  /* 拱門卡片 */
  .arch{
    position:relative; z-index:2; margin:-64px 22px 0; padding:26px 26px 30px;
    background:rgba(255,246,233,.94); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:200px 200px 22px 22px; text-align:center;
  }
  .arch::before{ /* 內框細線，做出包裝盒的雙框感 */
    content:"";position:absolute;inset:7px;border:1px solid rgba(102,60,27,.13);border-radius:193px 193px 16px 16px;pointer-events:none}
  .logo{width:112px;height:112px;margin:4px auto 0;border-radius:50%;overflow:hidden;background:#000;
    box-shadow:0 0 0 4px var(--cream),0 0 0 5px var(--line),0 8px 20px -8px rgba(40,24,12,.5)}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-weight:600;font-size:30px;letter-spacing:.32em;margin:18px 0 0 .32em;line-height:1.2}
  .en{font-family:var(--latin);font-weight:500;font-size:14px;letter-spacing:.38em;margin-top:6px;color:var(--soft)}
  .rule{display:flex;align-items:center;gap:10px;margin:18px auto 14px;width:78%;color:var(--rose)}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .rule svg{width:14px;height:14px;fill:currentColor}
  .tagline{font-size:15.5px;letter-spacing:.2em;line-height:1.9}
  .tagline-en{font-family:var(--latin);font-style:italic;font-size:15.5px;color:var(--soft);margin-top:2px}
  .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:16px;font-size:12.5px;letter-spacing:.14em;color:var(--soft)}
  .chips span+span::before{content:"·";margin-right:14px;color:var(--rose)}
  .chips span{color:var(--orange)}

  /* 社群圖示 */
  .social{display:flex;justify-content:center;gap:14px;margin-top:22px}
  .social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--line);color:var(--caramel);transition:.25s;background:rgba(255,255,255,.35)}
  .social a:hover,.social a:focus-visible{background:var(--caramel);color:var(--cream);outline:none}
  .social svg{width:20px;height:20px;fill:currentColor}

  /* 按鈕 */
  .links{padding:26px 22px 6px;display:grid;gap:12px}
  .btn{
    position:relative;display:flex;align-items:center;gap:14px;padding:15px 18px 15px 20px;
    border:1px solid var(--line);border-radius:14px;background:rgba(255,246,233,.72);
    color:var(--caramel);text-decoration:none;cursor:pointer;font:inherit;text-align:left;width:100%;
    transition:transform .25s,box-shadow .25s,background .25s;
  }
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(102,60,27,.55);background:var(--cream);outline:none}
  .btn .ico{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--linen)}
  .btn .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .btn b{display:block;font-weight:600;font-size:16px;letter-spacing:.12em}
  .btn small{display:block;font-size:12px;letter-spacing:.1em;color:var(--soft);margin-top:3px}
  .btn .arr{margin-left:auto;font-family:var(--latin);font-size:20px;color:var(--rose)}
  .btn.primary{background:var(--caramel);color:var(--cream);border-color:var(--caramel)}
  .btn.primary small{color:rgba(255,246,233,.72)}
  .btn.primary .ico{background:rgba(255,246,233,.14)}
  .btn.primary .arr{color:rgba(255,246,233,.6)}
  .btn.primary:hover{background:#5a3417}

  /* 小相簿 */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:22px 22px 0}
  .shot{padding:0;border:0;background:none;cursor:zoom-in;border-radius:12px;display:block}
  .shot:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
  .gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;display:block;border:1px solid rgba(102,60,27,.12);transition:transform .3s,box-shadow .3s}
  .shot:hover img{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(102,60,27,.55)}
  /* 照片放大：奶油色卡框＋編號圓章（沿用菜單的 M 編號設計） */
  #photo{width:min(90vw,420px,calc((100vh - 190px)*.8 + 24px))}
  #photo .pcard{background:var(--cream);padding:12px 12px 18px;border-radius:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
  #photo img{width:100%;height:auto;max-height:none;aspect-ratio:4/5;object-fit:cover;border-radius:6px}
  #photo .pcap{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;color:var(--caramel)}
  #photo .pno{flex:none;width:42px;height:42px;border-radius:50%;background:var(--caramel);color:var(--cream);display:grid;place-items:center;
    font-family:var(--latin);font-size:15px;font-weight:600;font-variant-numeric:lining-nums}
  #photo .pname{font-size:19px;letter-spacing:.26em;font-weight:600}
  dialog[open]{animation:pop .35s cubic-bezier(.2,.7,.2,1)}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  /* 訂購須知 */
  .note{margin:22px 22px 0;padding:18px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-size:13px;line-height:2;letter-spacing:.08em;color:var(--ink)}
  .note dt{font-family:var(--latin);font-style:italic;font-weight:500;font-size:16px;color:#8A5A4E;letter-spacing:.06em}
  .note dd{display:flex;gap:10px}
  .note dd::before{content:"♪";color:var(--rose);font-size:11px;line-height:26px}

  footer{text-align:center;padding:26px 22px 34px;font-size:12.5px;letter-spacing:.2em;color:var(--soft)}
  footer .sig{font-family:var(--latin);font-style:italic;font-size:17px;letter-spacing:.04em;color:var(--caramel);margin-bottom:6px}

  /* 菜單燈箱 */
  dialog{border:0;padding:0;background:transparent;max-width:min(94vw,620px);max-height:92vh;margin:auto}
  dialog::backdrop{background:rgba(40,24,12,.72);backdrop-filter:blur(4px)}
  dialog img{width:100%;height:auto;max-height:86vh;object-fit:contain;border-radius:10px;display:block}
  dialog button{display:block;margin:12px auto 0;background:var(--cream);color:var(--caramel);border:0;border-radius:99px;
    padding:9px 26px;font:inherit;font-size:14px;letter-spacing:.2em;cursor:pointer}

  /* 進場 */
  @media (prefers-reduced-motion:no-preference){
    .arch,.links .btn,.gallery,.note{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .links .btn:nth-child(1){animation-delay:.15s}.links .btn:nth-child(2){animation-delay:.25s}
    .links .btn:nth-child(3){animation-delay:.35s}.gallery{animation-delay:.45s}.note{animation-delay:.55s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  }
</style>
</head>

<script>
  const menu=document.getElementById('menu'), photo=document.getElementById('photo');
  document.getElementById('openMenu').onclick=()=>menu.showModal();
  document.querySelectorAll('.shot').forEach(b=>b.onclick=()=>{
    const s=b.querySelector('img'), big=photo.querySelector('img');
    big.src=s.src; big.alt=s.alt;
    photo.querySelector(".pno").textContent=b.dataset.no;
    photo.querySelector(".pname").textContent=b.dataset.name;
    photo.showModal();
  });
  document.querySelectorAll('dialog').forEach(d=>{
    d.querySelector('.close').onclick=()=>d.close();
    d.addEventListener('click',e=>{if(e.target===d)d.close()});
  });
</script>
